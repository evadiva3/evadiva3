name: generate animated snake

on:
  schedule:
    - cron: "7 0 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - README.md
      - .github/workflows/snake.yml

concurrency:
  group: profile-assets
  cancel-in-progress: false

jobs:
  generate:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: Platane/snk/svg-only@v3
        with:
          github_user_name: evadiva3
          outputs: |
            assets/snake.svg?color_snake=#171717&color_dots=#efefea,#c7c7bc,#93938a,#55554f,#242422
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Commit refreshed snake
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/snake.svg
          if ! git diff --cached --quiet; then
            git commit -m "chore: refresh monochrome contribution snake"
            git push
          fi
