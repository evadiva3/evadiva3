name: update readme stats cards

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - README.md
      - .github/workflows/stats.yml
      - scripts/theme-assets.py

concurrency:
  group: profile-assets
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Fetch current GitHub statistics
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: stats
          options: username=evadiva3&show_icons=true&hide_border=true&include_all_commits=true&hide_rank=true&bg_color=00000000&title_color=ffffff&icon_color=ffffff&text_color=f5f7fa
          path: assets/stats-source.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Fetch current repository languages
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: top-langs
          options: username=evadiva3&layout=compact&langs_count=10&hide_border=true&bg_color=00000000&title_color=ffffff&text_color=f5f7fa
          path: assets/languages-source.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Keep cards bright, outlined, and animated
        run: python scripts/theme-assets.py --stats

      - name: Save refreshed profile cards
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/stats-white.svg assets/languages-white.svg
          if ! git diff --cached --quiet; then
            git commit -m "chore: refresh bright profile cards"
            git pull --rebase origin main
            git push
          fi
