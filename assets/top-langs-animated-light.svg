    <g data-profile-motion="true" class="profile-motion" mask="url(#rect-mask)" aria-hidden="true"><rect x="-28" y="0" width="28" height="8" fill="#1f2328" opacity=".24"><animate attributeName="x" values="-28;250;250;-28" keyTimes="0;.45;.97;1" dur="7s" repeatCount="indefinite" /></rect></g></svg>

        </g>
      <style>.header,.icon{fill:#1f2328}.stat,.rank-text,.lang-name{fill:#59636e}.progress-background{fill:#ebedf0}.card-bg{fill:none;stroke:none;fill-opacity:0}</style><style data-profile-motion="true">
      .stagger{opacity:1;animation:none}
      .stagger.profile-stat-row{animation:profileRowBreathe 7s ease-in-out infinite}
      #rect-mask rect,.lang-progress{animation:none!important}
      @keyframes profileRowBreathe{0%,100%{opacity:.86}28%,58%{opacity:1}}
      @media(prefers-reduced-motion:reduce){
        .stagger.profile-stat-row{animation:none!important;opacity:1}
        .profile-motion{display:none}
      }
    </style></svg>
