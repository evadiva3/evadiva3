name: generate animated snake

on:
  schedule:
    - cron: "7 0 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - README.md
      - .github/workflows/snake.yml
      - scripts/theme-assets.py

concurrency:
  group: profile-assets
  cancel-in-progress: false

jobs:
  generate:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: Platane/snk/svg-only@v3
        with:
          github_user_name: evadiva3
          outputs: |
            assets/snake-light.svg?color_snake=#1f2328&color_dots=#ebebeb,#c6c6c6,#969696,#666666,#3a3a3a
            assets/snake-dark.svg?color_snake=#e6edf3&color_dots=#242424,#414141,#686868,#939393,#bdbdbd
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Keep snake backgrounds transparent
        run: python scripts/theme-assets.py --snake
      - name: Commit refreshed snakes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/snake-light.svg assets/snake-dark.svg
          if ! git diff --cached --quiet; then
            git commit -m "chore: refresh theme-aware contribution snake"
            git push
          fi
